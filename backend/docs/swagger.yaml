basePath: /api/v1
definitions:
  handler.BusyHourItem:
    properties:
      hour:
        type: integer
      transaction_count:
        type: integer
    type: object
  handler.CategorySalesItem:
    properties:
      category_name:
        type: string
      total_quantity:
        type: integer
      total_sales:
        type: number
    type: object
  handler.CheckoutResponse:
    properties:
      snap_redirect_url:
        type: string
      snap_token:
        type: string
      transaction:
        $ref: '#/definitions/model.Transaction'
    type: object
  handler.CreateCategoryRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handler.CreateCustomerRequest:
    properties:
      name:
        type: string
      phone:
        type: string
    required:
    - name
    - phone
    type: object
  handler.CreateIngredientRequest:
    properties:
      current_stock:
        type: number
      min_threshold:
        type: number
      name:
        type: string
      unit:
        type: string
    required:
    - name
    - unit
    type: object
  handler.CreateItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
    required:
    - product_id
    - quantity
    type: object
  handler.CreateProductRequest:
    properties:
      category_id:
        type: integer
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        minimum: 0
        type: number
    required:
    - category_id
    - name
    - price
    type: object
  handler.CreateTransactionRequest:
    properties:
      customer_id:
        type: string
      items:
        items:
          $ref: '#/definitions/handler.CreateItemRequest'
        type: array
      payment_method:
        $ref: '#/definitions/model.PaymentMethod'
      promo_code:
        type: string
    required:
    - items
    - payment_method
    type: object
  handler.CreateUserRequest:
    properties:
      email:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      password:
        minLength: 6
        type: string
      role:
        allOf:
        - $ref: '#/definitions/model.Role'
        enum:
        - owner
        - kasir
        - staff
    required:
    - email
    - name
    - password
    - role
    type: object
  handler.CustomerRankingItem:
    properties:
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      total_spent:
        type: number
      total_transactions:
        type: integer
    type: object
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handler.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
  handler.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  handler.MidtransPayload:
    properties:
      fraud_status:
        type: string
      gross_amount:
        type: string
      order_id:
        type: string
      payment_type:
        type: string
      signature_key:
        type: string
      status_code:
        type: string
      transaction_status:
        type: string
    type: object
  handler.PaymentMethodItem:
    properties:
      payment_method:
        type: string
      total_sales:
        type: number
      transaction_count:
        type: integer
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.RefreshResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  handler.Response:
    properties:
      data: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/handler.Meta'
      status:
        type: string
    type: object
  handler.RestockRequest:
    properties:
      notes:
        type: string
      quantity:
        type: number
    required:
    - quantity
    type: object
  handler.RunoutPrediction:
    properties:
      avg_daily_usage:
        type: number
      current_stock:
        type: number
      days_remaining:
        description: -1 means infinite/no usage
        type: number
      estimated_runout_date:
        type: string
      ingredient_id:
        type: string
      ingredient_name:
        type: string
      unit:
        type: string
    type: object
  handler.SaveRecipeItemRequest:
    properties:
      ingredient_id:
        type: string
      quantity:
        type: number
    required:
    - ingredient_id
    - quantity
    type: object
  handler.SendWhatsAppReceiptRequest:
    properties:
      phone:
        type: string
    type: object
  handler.UpdateCategoryRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handler.UpdateCustomerRequest:
    properties:
      name:
        type: string
      phone:
        type: string
    required:
    - name
    - phone
    type: object
  handler.UpdateIngredientRequest:
    properties:
      current_stock:
        minimum: 0
        type: number
      min_threshold:
        type: number
      name:
        type: string
      unit:
        type: string
    required:
    - current_stock
    - name
    - unit
    type: object
  handler.UpdateProductRequest:
    properties:
      category_id:
        type: integer
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        minimum: 0
        type: number
    type: object
  handler.UpdateUserRequest:
    properties:
      email:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      password:
        description: Optional
        type: string
      role:
        allOf:
        - $ref: '#/definitions/model.Role'
        enum:
        - owner
        - kasir
        - staff
    required:
    - email
    - name
    - role
    type: object
  model.Category:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  model.Customer:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      total_spent:
        type: number
      total_transactions:
        type: integer
    type: object
  model.Ingredient:
    properties:
      created_at:
        type: string
      current_stock:
        type: number
      id:
        type: string
      is_low:
        type: boolean
      min_threshold:
        type: number
      name:
        type: string
      unit:
        type: string
    type: object
  model.PaymentMethod:
    enum:
    - cash
    - transfer
    - midtrans
    type: string
    x-enum-varnames:
    - PaymentCash
    - PaymentTransfer
    - PaymentMidtrans
  model.PaymentStatus:
    enum:
    - pending
    - paid
    - failed
    - expired
    type: string
    x-enum-varnames:
    - PaymentStatusPending
    - PaymentStatusPaid
    - PaymentStatusFailed
    - PaymentStatusExpired
  model.Product:
    properties:
      category:
        $ref: '#/definitions/model.Category'
      category_id:
        type: integer
      created_at:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
    type: object
  model.RecipeItem:
    properties:
      id:
        type: string
      ingredient:
        $ref: '#/definitions/model.Ingredient'
      ingredient_id:
        type: string
      product_id:
        type: string
      quantity:
        type: number
    type: object
  model.Role:
    enum:
    - owner
    - kasir
    - staff
    type: string
    x-enum-varnames:
    - RoleOwner
    - RoleKasir
    - RoleStaff
  model.StockMovement:
    properties:
      created_at:
        type: string
      id:
        type: string
      ingredient_id:
        type: string
      notes:
        type: string
      quantity:
        type: number
      transaction_id:
        type: string
      type:
        $ref: '#/definitions/model.StockMovementType'
    type: object
  model.StockMovementType:
    enum:
    - in
    - out
    type: string
    x-enum-varnames:
    - StockIn
    - StockOut
  model.Transaction:
    properties:
      created_at:
        type: string
      customer_id:
        type: string
      discount_amount:
        type: number
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/model.TransactionItem'
        type: array
      midtrans_order_id:
        type: string
      midtrans_token:
        type: string
      payment_method:
        $ref: '#/definitions/model.PaymentMethod'
      payment_status:
        $ref: '#/definitions/model.PaymentStatus'
      promo_code:
        type: string
      status:
        $ref: '#/definitions/model.TransactionStatus'
      total_amount:
        type: number
      user_id:
        type: string
    type: object
  model.TransactionItem:
    properties:
      id:
        type: string
      product:
        $ref: '#/definitions/model.Product'
      product_id:
        type: string
      quantity:
        type: integer
      subtotal:
        type: number
      transaction_id:
        type: string
      unit_price:
        type: number
    type: object
  model.TransactionStatus:
    enum:
    - pending
    - completed
    - cancelled
    type: string
    x-enum-varnames:
    - TxStatusPending
    - TxStatusCompleted
    - TxStatusCancelled
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      role:
        $ref: '#/definitions/model.Role'
    type: object
host: localhost:8080
info:
  contact:
    email: dev@mentaimental.com
    name: Mentai Mental Dev
  description: REST API untuk sistem Point of Sale Mentai Mental
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: POS Mentai Mental API
  version: "1.0"
paths:
  /analytics/busy-hours:
    get:
      description: Get transaction count distribution grouped by hour of day for completed
        transactions
      parameters:
      - description: Number of days to analyze (default 30)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handler.BusyHourItem'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Get Busy Hours
      tags:
      - analytics
  /analytics/category-sales:
    get:
      description: Get sales total and quantity sold grouped by product category
      parameters:
      - description: Number of days (default 30)
        in: query
        name: days
        type: integer
      - description: Start date YYYY-MM-DD
        in: query
        name: start_date
        type: string
      - description: End date YYYY-MM-DD
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handler.CategorySalesItem'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Get Category Sales Analytics
      tags:
      - analytics
  /analytics/customers/ranking:
    get:
      description: Get customers ranked by total spending amount
      parameters:
      - description: Number of top customers (default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handler.CustomerRankingItem'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Get Customer Ranking
      tags:
      - analytics
  /analytics/overview:
    get:
      description: Get total sales, transaction counts, low stock counts, and top
        products
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Get Overview Analytics
      tags:
      - analytics
  /analytics/payment-methods:
    get:
      description: Get sales total and transaction counts grouped by payment method
      parameters:
      - description: Number of days (default 30)
        in: query
        name: days
        type: integer
      - description: Start date YYYY-MM-DD
        in: query
        name: start_date
        type: string
      - description: End date YYYY-MM-DD
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handler.PaymentMethodItem'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Get Payment Methods Analytics
      tags:
      - analytics
  /analytics/runout-predictions:
    get:
      description: Calculate average consumption rate over past 7 days to estimate
        deplete dates
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handler.RunoutPrediction'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Get Inventory Runout Predictions
      tags:
      - analytics
  /analytics/sales-trend:
    get:
      description: Get sales and order counts trend over the last N days or custom
        range, grouped by daily or monthly period
      parameters:
      - description: Number of days (default 7)
        in: query
        name: days
        type: integer
      - description: Start date YYYY-MM-DD
        in: query
        name: start_date
        type: string
      - description: End date YYYY-MM-DD
        in: query
        name: end_date
        type: string
      - description: 'Period grouping: daily or monthly (default daily)'
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Get Sales Trend
      tags:
      - analytics
  /auth/login:
    post:
      consumes:
      - application/json
      description: Log in a user and return access and refresh tokens
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.Response'
      summary: User Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Blacklist the current JWT access token to invalidate the session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: User Logout
      tags:
      - auth
  /auth/profile:
    get:
      description: Get current authenticated user profile details
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Get Profile
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Generate a new access token using a valid refresh token
      parameters:
      - description: Refresh Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.RefreshResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.Response'
      summary: Token Refresh
      tags:
      - auth
  /categories:
    get:
      description: Get a list of all product categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Category'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Get All Categories
      tags:
      - product
    post:
      consumes:
      - application/json
      description: Add a new product category
      parameters:
      - description: Category Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Category'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Create Category
      tags:
      - product
  /categories/{id}:
    delete:
      description: Delete a product category from the system
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Delete Category
      tags:
      - product
    put:
      consumes:
      - application/json
      description: Rename an existing product category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Category Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Category'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Update Category
      tags:
      - product
  /customers:
    get:
      description: Get a list of all registered customers sorted by name
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Customer'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Get All Customers
      tags:
      - customer
    post:
      consumes:
      - application/json
      description: Register a new customer for loyalty spent tracking
      parameters:
      - description: Customer Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateCustomerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Customer'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Create Customer
      tags:
      - customer
  /customers/{id}:
    delete:
      description: Remove customer profile from the system
      parameters:
      - description: Customer UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Delete Customer
      tags:
      - customer
    get:
      description: Get total transactions, total spent, and basic details of a customer
      parameters:
      - description: Customer UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Customer'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: Get Customer by ID
      tags:
      - customer
    put:
      consumes:
      - application/json
      description: Modify name or phone number of a customer
      parameters:
      - description: Customer UUID
        in: path
        name: id
        required: true
        type: string
      - description: Customer Info
        in: body
        name: request
        required: true
